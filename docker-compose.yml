version: "3.9"

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nuvixo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-nuvixo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nuvixo_secret}
      POSTGRES_DB:       ${POSTGRES_DB:-nuvixo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nuvixo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nuvixo_net

  # ── Redis (for rate limiting / session caching) ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nuvixo_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nuvixo_net

  # ── Next.js Application ──────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: nuvixo_app
    restart: unless-stopped
    environment:
      DATABASE_URL:              postgresql://${POSTGRES_USER:-nuvixo}:${POSTGRES_PASSWORD:-nuvixo_secret}@postgres:5432/${POSTGRES_DB:-nuvixo}
      NEXTAUTH_URL:              ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET:           ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID:          ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET:      ${GOOGLE_CLIENT_SECRET}
      CLOUDINARY_CLOUD_NAME:     ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY:        ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET:     ${CLOUDINARY_API_SECRET}
      RAZORPAY_KEY_ID:           ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET:       ${RAZORPAY_KEY_SECRET}
      NEXT_PUBLIC_RAZORPAY_KEY:  ${RAZORPAY_KEY_ID}
      SMTP_HOST:                 ${SMTP_HOST}
      SMTP_PORT:                 ${SMTP_PORT:-587}
      SMTP_USER:                 ${SMTP_USER}
      SMTP_PASS:                 ${SMTP_PASS}
      SMTP_FROM:                 ${SMTP_FROM}
      NEXT_PUBLIC_GA4_ID:        ${NEXT_PUBLIC_GA4_ID}
      NODE_ENV:                  production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nuvixo_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Nginx reverse proxy (optional, for SSL termination) ──────────────────
  nginx:
    image: nginx:alpine
    container_name: nuvixo_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    networks:
      - nuvixo_net
    profiles:
      - production   # only starts with: docker compose --profile production up

volumes:
  postgres_data:
  redis_data:

networks:
  nuvixo_net:
    driver: bridge
